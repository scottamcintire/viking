`<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow">
<title>Viking Europe Itinerary</title>
<style>
  :root{
    --bg:#f7f7f5;
    --card:#ffffff;
    --text:#1f2937;
    --muted:#6b7280;
    --line:#e5e7eb;
    --accent:#0f766e;
    --accent2:#134e4a;
    --soft:#ecfdf5;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  .app{
    display:grid;
    grid-template-columns:280px 1fr;
    min-height:100vh;
  }
  .sidebar{
    background:#fff;
    border-right:1px solid var(--line);
    padding:20px 16px;
    position:sticky;
    top:0;
    height:100vh;
    overflow:auto;
  }
  .brand{
    font-size:22px;
    font-weight:700;
    margin-bottom:6px;
  }
  .sub{
    color:var(--muted);
    font-size:14px;
    margin-bottom:18px;
    line-height:1.4;
  }
  .day-list{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .day-btn{
    width:100%;
    text-align:left;
    border:1px solid var(--line);
    background:#fff;
    border-radius:12px;
    padding:12px 14px;
    cursor:pointer;
    transition:.15s ease;
  }
  .day-btn:hover{border-color:#cbd5e1;background:#fafafa}
  .day-btn.active{
    border-color:var(--accent);
    background:var(--soft);
  }
  .day-btn .date{
    display:block;
    font-weight:700;
    font-size:14px;
    margin-bottom:2px;
  }
  .day-btn .label{
    display:block;
    color:var(--muted);
    font-size:13px;
  }
  .main{
    padding:24px;
    max-width:980px;
    width:100%;
    margin:0 auto;
  }
  .mobile-jump{
    display:none;
    margin-bottom:16px;
  }
  select{
    width:100%;
    padding:12px 14px;
    border-radius:12px;
    border:1px solid var(--line);
    font-size:16px;
    background:white;
  }
  .hero{
    background:linear-gradient(135deg,#ffffff,#f0fdfa);
    border:1px solid var(--line);
    border-radius:18px;
    padding:22px;
    margin-bottom:18px;
  }
  .hero h1{
    margin:0 0 6px 0;
    font-size:30px;
  }
  .hero p{
    margin:0;
    color:var(--muted);
    line-height:1.5;
  }
  .nav-row{
    display:flex;
    gap:10px;
    margin:16px 0 22px;
    flex-wrap:wrap;
  }
  .nav-row button{
    border:none;
    background:var(--accent);
    color:white;
    padding:12px 16px;
    border-radius:12px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }
  .nav-row button.secondary{
    background:#e5f3f1;
    color:var(--accent2);
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:22px;
    margin-bottom:16px;
  }
  .day-title{
    display:flex;
    justify-content:space-between;
    gap:16px;
    align-items:flex-start;
    flex-wrap:wrap;
    margin-bottom:10px;
  }
  .day-title h2{
    margin:0;
    font-size:28px;
  }
  .tag{
    background:var(--soft);
    color:var(--accent2);
    border:1px solid #c7f0df;
    padding:8px 10px;
    border-radius:999px;
    font-size:13px;
    font-weight:700;
  }
  .summary{
    color:var(--muted);
    font-size:16px;
    line-height:1.55;
    margin-bottom:18px;
  }
  .section-title{
    font-size:14px;
    font-weight:800;
    color:var(--accent2);
    letter-spacing:.04em;
    text-transform:uppercase;
    margin:18px 0 10px;
  }
  .timeline{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .item{
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px;
  }
  .item-time{
    color:var(--accent2);
    font-weight:800;
    font-size:13px;
    margin-bottom:4px;
  }
  .item-title{
    font-weight:700;
    margin-bottom:4px;
    font-size:17px;
  }
  .item-desc{
    color:var(--muted);
    line-height:1.5;
    font-size:15px;
  }
  .item-desc p{
    margin:0 0 8px 0;
  }
  .item-desc ul{
    margin:0;
    padding-left:18px;
  }
  .item-desc li{
    margin:0 0 4px 0;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px;
  }
  .note{
    background:#fffbeb;
    border:1px solid #fde68a;
    border-radius:14px;
    padding:14px;
    color:#7c5e10;
    line-height:1.5;
  }
  .footer-note{
    color:var(--muted);
    font-size:14px;
    margin-top:16px;
  }
  @media (max-width: 900px){
    .app{grid-template-columns:1fr}
    .sidebar{display:none}
    .main{padding:16px}
    .mobile-jump{display:block}
  }
  @media (max-width: 640px){
    .grid{grid-template-columns:1fr}
    .hero h1{font-size:24px}
    .day-title h2{font-size:24px}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">Europe Trip</div>
    <div class="sub">Day-by-day vacation itinerary</div>
    <div class="day-list" id="dayList"></div>
  </aside>

  <main class="main">
    <div class="mobile-jump">
      <select id="daySelect"></select>
    </div>

    <section class="hero">
      <h1>Europe 2026</h1>
  
    </section>

    <div class="nav-row">
      <button class="secondary" id="prevBtn">← Previous Day</button>
      <button id="nextBtn">Next Day →</button>
    </div>

    <section class="card">
      <div class="day-title">
        <div>
          <h2 id="dayHeading"></h2>
          <div class="summary" id="daySummary"></div>
        </div>
        <div class="tag" id="dayTag"></div>
      </div>

      <div class="section-title">Plan for the day</div>
      <div class="timeline" id="timeline"></div>

      <div class="section-title">Key details</div>
      <div class="grid" id="detailsGrid"></div>

      <div id="notesSection">
        <div class="section-title">Notes</div>
        <div class="note" id="notesBox"></div>
      </div>

      <div class="footer-note">Version built from your itinerary document and your Viking pre-purchased excursions PDF.</div>
    </section>

    <section class="card">
      <div class="section-title">Trip-wide reminders</div>
      <div class="timeline" id="globalNotes"></div>
    </section>
  </main>
</div>

let currentIndex = 0;

const daySummary = document.getElementById("daySummary");
const dayTag = document.getElementById("dayTag");
const timeline = document.getElementById("timeline");
const detailsGrid = document.getElementById("detailsGrid");
const notesBox = document.getElementById("notesBox");
const notesSection = document.getElementById("notesSection");

function renderNav() {
  dayList.innerHTML = "";
  daySelect.innerHTML = "";
  days.forEach((day, idx) => {
    const btn = document.createElement("button");
    btn.className = "day-btn" + (idx === currentIndex ? " active" : "");
    btn.innerHTML = `<span class="date">${day.date}</span><span class="label">${day.label}</span>`;
    btn.addEventListener("click", () => { currentIndex = idx; renderAll(); });
    dayList.appendChild(btn);

    const option = document.createElement("option");
    option.value = String(idx);
    option.textContent = `${day.date} — ${day.label}`;
    if (idx === currentIndex) option.selected = true;
    daySelect.appendChild(option);
  });
}

function renderDay() {
  const day = days[currentIndex];
  dayHeading.textContent = `${day.date} — ${day.label}`;
  daySummary.textContent = day.summary;
  dayTag.textContent = day.tag;

  timeline.innerHTML = "";
  day.timeline.forEach(item => {
    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `
      <div class="item-time">${item.time}</div>
      <div class="item-title">${item.title}</div>
      <div class="item-desc">${item.desc}</div>
    `;
    timeline.appendChild(div);
  });

  detailsGrid.innerHTML = "";
  day.details.forEach(([k,v]) => {
    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `
      <div class="item-time">${k}</div>
      <div class="item-title">${v}</div>
    `;
    detailsGrid.appendChild(div);
  });

  if (day.notes && day.notes.trim()) {
    notesBox.textContent = day.notes;
    notesSection.style.display = "block";
  } else {
    notesBox.textContent = "";
    notesSection.style.display = "none";
  }
  prevBtn.disabled = currentIndex === 0;
  nextBtn.disabled = currentIndex === days.length - 1;
  prevBtn.style.opacity = currentIndex === 0 ? .5 : 1;
  nextBtn.style.opacity = currentIndex === days.length - 1 ? .5 : 1;
  daySelect.value = String(currentIndex);
}

function renderGlobalNotes() {
  globalNotes.innerHTML = "";
  const notesToShow = currentIndex === 0 ? tripNotesTuesday : tripNotesSupportOnly;
  notesToShow.forEach(item => {
    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `
      <div class="item-time">${item.time}</div>
      <div class="item-title">${item.title}</div>
      <div class="item-desc">${item.desc}</div>
    `;
    globalNotes.appendChild(div);
  });
}

function renderAll() {
  renderNav();
  renderDay();
  renderGlobalNotes();
  window.scrollTo({top:0, behavior:"smooth"});
}

prevBtn.addEventListener("click", () => {
  if (currentIndex > 0) {
    currentIndex--;
    renderAll();
  }
});

nextBtn.addEventListener("click", () => {
  if (currentIndex < days.length - 1) {
    currentIndex++;
    renderAll();
  }
});

daySelect.addEventListener("change", (e) => {
  currentIndex = Number(e.target.value);
  renderAll();
});

renderAll();
</script>
</body>
</html>
